<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">oil-diff 五步执行工作流</title>
  <desc id="desc">采集 Git 快照、按业务模块归因、构建 HTML/CSS 舞台、渲染自包含 HTML、运行静态与视觉核验。</desc>
  <defs>
    <pattern id="g-wf" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DFD5C3" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="290" rx="26" fill="#FAF8F4"/>
  <rect width="1200" height="290" rx="26" fill="url(#g-wf)"/>
  <rect x="1" y="1" width="1198" height="288" rx="25" fill="none" stroke="#DFD5C3" stroke-width="1.5"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <!-- Connecting Line -->
    <path d="M160 132H1040" stroke="#C8B99E" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Step 1 -->
    <g transform="translate(40 42)">
      <rect width="208" height="198" rx="14" fill="#FFFDF9" stroke="#DFD5C3" stroke-width="1.5"/>
      <rect x="18" y="18" width="44" height="26" rx="6" fill="#EFEADE"/>
      <text x="40" y="36" text-anchor="middle" fill="#4A453D" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="700">01</text>
      <text x="18" y="72" fill="#1A1916" font-size="20" font-weight="750">采集 Git 快照</text>
      <text x="18" y="102" fill="#4D4942" font-size="14">自动写入 .gitignore (*)</text>
      <text x="18" y="124" fill="#4D4942" font-size="14">提取文件增删与行级</text>
      <text x="18" y="146" fill="#4D4942" font-size="14">hunks 到 diff-data.json</text>
      <text x="18" y="178" fill="#2E6A4E" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="700">collect_diff.py</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(268 42)">
      <rect width="208" height="198" rx="14" fill="#FFFDF9" stroke="#DFD5C3" stroke-width="1.5"/>
      <rect x="18" y="18" width="44" height="26" rx="6" fill="#EFEADE"/>
      <text x="40" y="36" text-anchor="middle" fill="#4A453D" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="700">02</text>
      <text x="18" y="72" fill="#1A1916" font-size="20" font-weight="750">归纳业务事项</text>
      <text x="18" y="102" fill="#4D4942" font-size="14">将全部改动归为 3-7 件</text>
      <text x="18" y="124" fill="#4D4942" font-size="14">业务事项，标注模块胶</text>
      <text x="18" y="146" fill="#4D4942" font-size="14">囊与完整句顶部速览</text>
      <text x="18" y="178" fill="#6E685F" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="700">report-spec.json</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(496 42)">
      <rect width="208" height="198" rx="14" fill="#FFFDF9" stroke="#DFD5C3" stroke-width="1.5"/>
      <rect x="18" y="18" width="44" height="26" rx="6" fill="#EBF3EE"/>
      <text x="40" y="36" text-anchor="middle" fill="#23533D" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="700">03</text>
      <text x="18" y="72" fill="#1A1916" font-size="20" font-weight="750">构建对比图示</text>
      <text x="18" y="102" fill="#4D4942" font-size="14">使用原生 HTML/CSS</text>
      <text x="18" y="124" fill="#4D4942" font-size="14">画出修改前后的流程、</text>
      <text x="18" y="146" fill="#4D4942" font-size="14">标尺或路由拆分图</text>
      <text x="18" y="178" fill="#2E6A4E" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="700">diagramHtml</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(724 42)">
      <rect width="208" height="198" rx="14" fill="#FFFDF9" stroke="#DFD5C3" stroke-width="1.5"/>
      <rect x="18" y="18" width="44" height="26" rx="6" fill="#EFEADE"/>
      <text x="40" y="36" text-anchor="middle" fill="#4A453D" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="700">04</text>
      <text x="18" y="72" fill="#1A1916" font-size="20" font-weight="750">渲染单文件页</text>
      <text x="18" y="102" fill="#4D4942" font-size="14">内联暖纸书页样式与</text>
      <text x="18" y="124" fill="#4D4942" font-size="14">右侧抽屉脚本，合成零</text>
      <text x="18" y="146" fill="#4D4942" font-size="14">外部依赖的 index.html</text>
      <text x="18" y="178" fill="#2E6A4E" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="700">render_report.py</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(952 42)">
      <rect width="208" height="198" rx="14" fill="#FFFDF9" stroke="#DFD5C3" stroke-width="1.5"/>
      <rect x="18" y="18" width="44" height="26" rx="6" fill="#F8ECEA"/>
      <text x="40" y="36" text-anchor="middle" fill="#8F3B31" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="700">05</text>
      <text x="18" y="72" fill="#1A1916" font-size="20" font-weight="750">质量与安全核验</text>
      <text x="18" y="102" fill="#4D4942" font-size="14">检查文件全覆盖、禁用</text>
      <text x="18" y="124" fill="#4D4942" font-size="14">黑话、抽屉 DOM 结构</text>
      <text x="18" y="146" fill="#4D4942" font-size="14">与 Git 状态零污染</text>
      <text x="18" y="178" fill="#8F3B31" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="12" font-weight="700">lint_report.py</text>
    </g>
  </g>
</svg>
