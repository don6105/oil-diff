<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">从零散 Git Diff 到按业务归因的可视化汇报页</title>
  <desc id="desc">对比直接阅读原始 Git Diff 与使用 oil-diff 阅读业务事项卡片加右侧原文对照抽屉的差异。</desc>
  <defs>
    <pattern id="g-ba" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#DFD5C3" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="440" rx="26" fill="#FAF8F4"/>
  <rect width="1200" height="440" rx="26" fill="url(#g-ba)"/>
  <rect x="1" y="1" width="1198" height="438" rx="25" fill="none" stroke="#DFD5C3" stroke-width="1.5"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <!-- Left: BEFORE -->
    <g transform="translate(48 42)">
      <rect width="98" height="26" rx="6" fill="#F8ECEA" stroke="#E4C3BE"/>
      <text x="49" y="18" text-anchor="middle" fill="#8F3B31" font-size="13" font-weight="750" letter-spacing="1.5">BEFORE</text>
      <text x="112" y="19" fill="#6E685F" font-size="16" font-weight="700">直接翻看 Git Diff 或弹窗看文件</text>

      <rect y="38" width="468" height="318" rx="16" fill="#1E1D1A" stroke="#36332E"/>
      <text x="24" y="74" fill="#E6E1D6" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="700">$ git diff 326e118..f9c78e5</text>

      <g transform="translate(24 94)" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14">
        <rect width="420" height="32" rx="6" fill="#2A2824"/>
        <text x="12" y="21" fill="#CFC9BC">references/component.md        |  10 +-</text>
        <rect y="40" width="420" height="32" rx="6" fill="#2A2824"/>
        <text x="12" y="61" fill="#CFC9BC">references/direction-content.md|  28 +++</text>
        <rect y="80" width="420" height="32" rx="6" fill="#2A2824"/>
        <text x="12" y="101" fill="#CFC9BC">references/review-loop.md      |  10 +-</text>
        <rect y="120" width="420" height="32" rx="6" fill="#2A2824"/>
        <text x="12" y="141" fill="#CFC9BC">scripts/shoot.mjs              | 120 +++-</text>
      </g>

      <g transform="translate(24 268)" fill="#B5ADA0" font-size="15" font-weight="550">
        <text x="0" y="0">• 按字母顺序排文件，看不出改了哪几块业务</text>
        <text x="0" y="26">• 没有修改前后的机制对比图，全靠脑补代码逻辑</text>
        <text x="0" y="52">• 在弹窗或手风琴里展开 diff，正文上下跳动极难对照</text>
      </g>
    </g>

    <!-- Center Arrow -->
    <g transform="translate(536 188)">
      <circle cx="28" cy="28" r="28" fill="#2E6A4E"/>
      <path d="M16 28h24M32 19l9 9-9 9" fill="none" stroke="#FFFDF9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Right: AFTER -->
    <g transform="translate(612 42)">
      <rect width="88" height="26" rx="6" fill="#EBF3EE" stroke="#BDD6C7"/>
      <text x="44" y="18" text-anchor="middle" fill="#23533D" font-size="13" font-weight="750" letter-spacing="1.5">AFTER</text>
      <text x="102" y="19" fill="#23533D" font-size="16" font-weight="700">用 oil-diff 生成四层结构汇报页</text>

      <rect y="38" width="540" height="318" rx="16" fill="#FFFDF9" stroke="#C8B99E" stroke-width="1.5"/>

      <!-- Step 1 -->
      <g transform="translate(22 58)">
        <rect width="496" height="54" rx="10" fill="#FAF8F4" stroke="#E2D9C8"/>
        <rect x="14" y="14" width="26" height="26" rx="6" fill="#EFEADE" stroke="#D8CEBC"/>
        <text x="27" y="32" text-anchor="middle" fill="#4A453D" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="700">1</text>
        <rect x="50" y="15" width="92" height="24" rx="6" fill="#EFEADE"/>
        <text x="96" y="31" text-anchor="middle" fill="#4A453D" font-size="13" font-weight="700">业务模块胶囊</text>
        <text x="154" y="32" fill="#1A1916" font-size="16" font-weight="700">顶部速览写完整人话句子，30 秒读完所有事项</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(22 122)">
        <rect width="496" height="54" rx="10" fill="#FAF8F4" stroke="#E2D9C8"/>
        <rect x="14" y="14" width="26" height="26" rx="6" fill="#EFEADE" stroke="#D8CEBC"/>
        <text x="27" y="32" text-anchor="middle" fill="#4A453D" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="700">2</text>
        <rect x="50" y="15" width="92" height="24" rx="6" fill="#EBF3EE"/>
        <text x="96" y="31" text-anchor="middle" fill="#23533D" font-size="13" font-weight="700">HTML/CSS 舞台</text>
        <text x="154" y="32" fill="#1A1916" font-size="16" font-weight="700">每章配修改前后流程、标尺或路由对比图示</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(22 186)">
        <rect width="496" height="54" rx="10" fill="#FAF8F4" stroke="#E2D9C8"/>
        <rect x="14" y="14" width="26" height="26" rx="6" fill="#EFEADE" stroke="#D8CEBC"/>
        <text x="27" y="32" text-anchor="middle" fill="#4A453D" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="700">3</text>
        <rect x="50" y="15" width="92" height="24" rx="6" fill="#EFEADE"/>
        <text x="96" y="31" text-anchor="middle" fill="#4A453D" font-size="13" font-weight="700">紧凑文件树</text>
        <text x="154" y="32" fill="#1A1916" font-size="16" font-weight="700">右侧 28px 单行文件树随滚动高亮当前章节改动</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(22 250)">
        <rect width="496" height="54" rx="10" fill="#EFE6D5" stroke="#BBA882"/>
        <rect x="14" y="14" width="26" height="26" rx="6" fill="#FFFDF9" stroke="#C8B99E"/>
        <text x="27" y="32" text-anchor="middle" fill="#1A1916" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="700">4</text>
        <rect x="50" y="15" width="92" height="24" rx="6" fill="#FFFDF9"/>
        <text x="96" y="31" text-anchor="middle" fill="#1A1916" font-size="13" font-weight="700">右侧原文抽屉</text>
        <text x="154" y="32" fill="#1A1916" font-size="16" font-weight="700">点击任意文件条滑出左右对照抽屉，正文零跳动</text>
      </g>
    </g>
  </g>
</svg>
