<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="title desc">
  <title id="title">README made with beautify-github-readme</title>
  <desc id="desc">使用 beautify-github-readme 設計與製作的 README 標章。</desc>
  <rect width="420" height="64" rx="14" fill="#FAF8F4"/>
  <rect x="1" y="1" width="418" height="62" rx="13" fill="none" stroke="#DFD5C3" stroke-width="1.5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif">
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#EFEADE" stroke="#D8CEBC"/>
    <text x="32" y="37" text-anchor="middle" fill="#2E6A4E" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="13" font-weight="800">±</text>
    <text x="62" y="27" fill="#6E685F" font-size="11" font-weight="700" letter-spacing="1.8">README MADE WITH</text>
    <text x="62" y="46" fill="#1A1916" font-size="15" font-weight="750">beautify-github-readme</text>
    <text x="386" y="38" fill="#6E685F" font-size="16" font-weight="700">↗</text>
  </g>
</svg>
